[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrouter-image-mcp"
version = "0.2.0"
description = "MCP server for image and video generation via OpenRouter, with model and provider selection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "openrouter", "image-generation", "claude", "nano-banana", "video-generation", "veo", "kling", "seedance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "mcp>=2.1,<3",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
openrouter-image-mcp = "openrouter_image_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/sneffets/openrouter-image-mcp"
Issues = "https://github.com/sneffets/openrouter-image-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openrouter_image_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
